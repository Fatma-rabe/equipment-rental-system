name: equipment_rental_system
description: "A new Flutter project."
publish_to: 'none' # Prevent publishing to pub.dev

version: 1.0.0+1

environment:
  sdk: ">=3.8.1 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Image handling
  image_picker: ^1.1.1

  # Internationalization
  intl: ^0.18.1

  # PDF & Printing
  pdf: ^3.10.4
  printing: ^5.12.0

  # Cupertino Icons for iOS
  cupertino_icons: ^1.0.8

  # HTTP package for API requests
  http: ^0.13.6

  #jwt decode
  jwt_decode: ^0.3.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700